<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusERP - Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono-code { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col md:flex-row min-h-screen">

    <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 p-4 flex flex-col justify-between flex-shrink-0">
        <div class="space-y-6">
            <div class="flex items-center space-x-3 p-2 border-b border-slate-800 pb-4">
                <div class="w-10 h-10 rounded-xl bg-sky-600 flex items-center justify-center font-bold text-white shadow-lg">
                    <i class="fa-solid fa-server"></i>
                </div>
                <div>
                    <h1 class="font-bold text-white text-base">NexusERP</h1>
                    <p class="text-xs text-slate-400">Administration & IAM</p>
                </div>
            </div>

            <nav class="space-y-1">
                <button onclick="window.showTab('dashboard')" id="btn-dashboard" class="nav-link w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition bg-sky-600 text-white">
                    <i class="fa-solid fa-chart-pie w-5"></i><span>Tableau de bord</span>
                </button>
                <button onclick="window.showTab('quotes')" id="btn-quotes" class="nav-link w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-file-contract w-5"></i><span>Devis Infrastructure</span>
                </button>
                <button onclick="window.showTab('invoices')" id="btn-invoices" class="nav-link w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-file-invoice-dollar w-5"></i><span>Facturation</span>
                </button>
                <button onclick="window.showTab('qrcode')" id="btn-qrcode" class="nav-link w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-qrcode w-5"></i><span>Générateur QR Code</span>
                </button>
            </nav>
        </div>
    </aside>

    <main class="flex-1 p-6 md:p-8 overflow-y-auto">
        <div class="flex justify-between items-center pb-6 mb-6 border-b border-slate-800">
            <div>
                <h2 class="text-2xl font-bold text-white">Panneau de Contrôle</h2>
                <p class="text-sm text-slate-400">Gestion et création de documents détaillés.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="window.openModal('quote')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl shadow-lg transition text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i><span>Nouveau Devis</span>
                </button>
                <button onclick="window.openModal('invoice')" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-4 py-2.5 rounded-xl shadow-lg transition text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i><span>Nouvelle Facture</span>
                </button>
            </div>
        </div>

        <div id="tab-dashboard" class="tab-pane space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700/50">
                    <span class="text-xs uppercase text-slate-400 font-semibold">Devis Enregistrés</span>
                    <h3 class="text-2xl font-bold text-sky-400 mt-2" id="stat-quotes-count">0</h3>
                </div>
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700/50">
                    <span class="text-xs uppercase text-slate-400 font-semibold">Chiffre d'Affaires Total</span>
                    <h3 class="text-2xl font-bold text-emerald-400 mt-2" id="stat-revenue">0.00 €</h3>
                </div>
            </div>
        </div>

        <div id="tab-quotes" class="tab-pane hidden space-y-6">
            <div class="bg-slate-800 border border-slate-700/50 rounded-2xl p-4 shadow-xl overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase text-slate-400 border-b border-slate-700 pb-2">
                        <tr>
                            <th class="p-3">N° Devis</th><th class="p-3">Client</th><th class="p-3">Total TTC</th><th class="p-3">Statut</th><th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="quotes-list" class="divide-y divide-slate-700/50"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-invoices" class="tab-pane hidden space-y-6">
            <div class="bg-slate-800 border border-slate-700/50 rounded-2xl p-4 shadow-xl overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase text-slate-400 border-b border-slate-700 pb-2">
                        <tr>
                            <th class="p-3">N° Facture</th><th class="p-3">Client</th><th class="p-3">Total TTC</th><th class="p-3">Statut</th><th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="invoices-list" class="divide-y divide-slate-700/50"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-qrcode" class="tab-pane hidden space-y-6">
            <div class="bg-slate-800 border border-slate-700/50 rounded-2xl p-6 shadow-xl max-w-xl mx-auto space-y-5">
                <h3 class="text-lg font-bold text-white mb-1">Générer un QR Code</h3>
                <input type="text" id="qr-input" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
                <button onclick="window.generateQRCode()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl">Générer</button>
                <div id="qr-result" class="hidden flex flex-col items-center justify-center p-6 bg-slate-950 rounded-xl space-y-4">
                    <div id="qrcode-container" class="bg-white p-4 rounded-xl"></div>
                    <a id="qr-download-btn" download="qrcode.png" class="px-4 py-2 bg-emerald-600 text-white font-semibold text-xs rounded-lg">Télécharger</a>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL AVEC SERVICES DYNAMIQUES -->
    <div id="modal-container" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-lg text-white" id="modal-title">Nouveau Document</h3>
                <button onclick="window.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="generic-form" onsubmit="window.saveDocument(event)" class="space-y-4">
                <input type="hidden" id="form-type" value="quote">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nom du Client</label>
                    <input type="text" id="form-client" required placeholder="ex: TechCorp SARL" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
                </div>

                <!-- SECTION DES SERVICES -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs text-slate-400 font-bold uppercase">Lignes de prestations / services</label>
                        <button type="button" onclick="window.addItemRow()" class="text-xs bg-sky-600/20 text-sky-400 hover:bg-sky-600 hover:text-white px-2.5 py-1 rounded-lg transition font-semibold">
                            <i class="fa-solid fa-plus mr-1"></i>Ajouter une ligne
                        </button>
                    </div>
                    <div id="items-container" class="space-y-2">
                        <!-- Injecté dynamiquement -->
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onclick="window.closeModal()" class="px-4 py-2 rounded-xl border border-slate-800 text-sm text-slate-300">Annuler</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://esjdlddwxqkhrytvrcok.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzamRsZGR3eHFraHJ5dHZyY29rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTAzOTMsImV4cCI6MjEwODI2NjM5M30.Ec2VMKOjh-XqVRB_gAslFhhP7103pZxEqI33ySoddZ0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let quotes = [];
        let invoices = [];

        window.showTab = function(tabName) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-link').forEach(btn => {
                btn.classList.remove('bg-sky-600', 'text-white');
                btn.classList.add('text-slate-400');
            });
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('btn-' + tabName).classList.add('bg-sky-600', 'text-white');
            document.getElementById('btn-' + tabName).classList.remove('text-slate-400');
            if(tabName === 'quotes') loadQuotesFromDB();
            if(tabName === 'invoices') loadInvoicesFromDB();
        };

      window.openModal = function(type) {
    document.getElementById('form-type').value = type;
    document.getElementById('modal-title').innerText = type === 'quote' ? 'Nouveau Devis' : 'Nouvelle Facture';
    
    // CORRECTION ICI : Réinitialisation propre du conteneur de lignes
    document.getElementById('items-container').innerHTML = '';
    
    window.addItemRow(); // Ajoute la première ligne de service par défaut
    document.getElementById('modal-container').classList.remove('hidden');
};
        window.closeModal = function() {
            document.getElementById('modal-container').classList.add('hidden');
            document.getElementById('generic-form').reset();
        };

        window.addItemRow = function(desc = '', qty = 1, price = 0) {
            const container = document.getElementById('items-container');
            const rowId = Date.now() + Math.random();
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800 item-row";
            div.innerHTML = `
                <input type="text" placeholder="Description du service" value="${desc}" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white item-desc" required>
                <input type="number" placeholder="Qté" value="${qty}" min="1" class="w-16 bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white item-qty" required>
                <input type="number" step="0.01" placeholder="Prix HT" value="${price}" class="w-24 bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white item-price" required>
                <button type="button" onclick="this.parentElement.remove()" class="text-rose-400 hover:text-rose-300 px-2 py-1 text-xs"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        };

        window.saveDocument = async function(e) {
            e.preventDefault();
            const type = document.getElementById('form-type').value;
            const client = document.getElementById('form-client').value.trim();
            const prefix = type === 'quote' ? 'DEV-2026-' : 'FAC-2026-';
            const newId = prefix + Math.floor(100 + Math.random() * 900);
            const tableName = type === 'quote' ? 'devis' : 'factures';
            const statusVal = type === 'quote' ? 'SENT' : 'PAID';

            // Collecter les lignes de services
            const rows = document.querySelectorAll('.item-row');
            let items = [];
            let totalHT = 0;

            rows.forEach(r => {
                const desc = r.querySelector('.item-desc').value;
                const qty = parseFloat(r.querySelector('.item-qty').value);
                const price = parseFloat(r.querySelector('.item-price').value);
                const lineTotal = qty * price;
                totalHT += lineTotal;
                items.push({ doc_id: newId, description: desc, quantity: qty, unit_price: price });
            });

            const totalTTC = totalHT * 1.20; // TVA 20%

            // 1. Inserer le document principal
            const { error: docError } = await supabaseClient.from(tableName).insert([{
                id: newId, client_name: client, amount_ttc: totalTTC.toFixed(2), status: statusVal
            }]);

            if (docError) { alert("Erreur: " + docError.message); return; }

            // 2. Insérer les lignes associées
            if (items.length > 0) {
                await supabaseClient.from('document_items').insert(items);
            }

            window.closeModal();
            if (type === 'quote') loadQuotesFromDB();
            else loadInvoicesFromDB();
            initDashboard();
        };

        window.deleteDocument = async function(type, id) {
            const tableName = type === 'quote' ? 'devis' : 'factures';
            if (!confirm(`Supprimer ${id} ?`)) return;
            await supabaseClient.from('document_items').delete().eq('doc_id', id);
            await supabaseClient.from(tableName).delete().eq('id', id);
            if (type === 'quote') loadQuotesFromDB();
            else loadInvoicesFromDB();
            initDashboard();
        };

        async function loadQuotesFromDB() {
            const { data } = await supabaseClient.from('devis').select('*').order('created_at', { ascending: false });
            quotes = data || [];
            renderQuotes();
        }

        async function loadInvoicesFromDB() {
            const { data } = await supabaseClient.from('factures').select('*').order('created_at', { ascending: false });
            invoices = data || [];
            renderInvoices();
        }

        async function initDashboard() {
            const { data: qData } = await supabaseClient.from('devis').select('*');
            const { data: fData } = await supabaseClient.from('factures').select('*');
            if(qData) document.getElementById('stat-quotes-count').innerText = qData.length;
            if(fData) {
                const total = fData.reduce((acc, curr) => acc + parseFloat(curr.amount_ttc || 0), 0);
                document.getElementById('stat-revenue').innerText = total.toFixed(2) + ' €';
            }
        }

        function renderQuotes() {
            document.getElementById('quotes-list').innerHTML = quotes.map(q => `
                <tr>
                    <td class="p-3 font-mono-code font-bold text-sky-400">${q.id}</td>
                    <td class="p-3 text-white">${q.client_name}</td>
                    <td class="p-3 font-bold">${q.amount_ttc} €</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs bg-amber-500/10 text-amber-400">${q.status}</span></td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="navigator.clipboard.writeText(window.location.origin + '/?devis=' + '${q.id}'); alert('Lien copié !');" class="px-2 py-1 bg-sky-600/20 text-sky-400 rounded text-xs">Lien</button>
                        <button onclick="window.deleteDocument('quote', '${q.id}')" class="px-2 py-1 bg-rose-600/20 text-rose-400 rounded text-xs">Suppr</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderInvoices() {
            document.getElementById('invoices-list').innerHTML = invoices.map(f => `
                <tr>
                    <td class="p-3 font-mono-code font-bold text-emerald-400">${f.id}</td>
                    <td class="p-3 text-white">${f.client_name}</td>
                    <td class="p-3 font-bold">${f.amount_ttc} €</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs bg-emerald-500/10 text-emerald-400">${f.status}</span></td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="navigator.clipboard.writeText(window.location.origin + '/?facture=' + '${f.id}'); alert('Lien copié !');" class="px-2 py-1 bg-sky-600/20 text-sky-400 rounded text-xs">Lien</button>
                        <button onclick="window.deleteDocument('invoice', '${f.id}')" class="px-2 py-1 bg-rose-600/20 text-rose-400 rounded text-xs">Suppr</button>
                    </td>
                </tr>
            `).join('');
        }

        window.generateQRCode = function() {
            const inputVal = document.getElementById('qr-input').value.trim();
            const container = document.getElementById('qrcode-container');
            container.innerHTML = "";
            document.getElementById('qr-result').classList.remove('hidden');
            new QRCode(container, { text: inputVal, width: 200, height: 200 });
        };

        initDashboard();
    </script>
</body>
</html>
