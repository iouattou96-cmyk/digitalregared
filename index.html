<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusERP - Consultation Document</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono-code { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex items-center justify-center p-4">

    <div class="bg-slate-950 border border-slate-800 rounded-2xl max-w-lg w-full p-8 shadow-2xl space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <span id="doc-type" class="px-3 py-1 rounded-md text-xs font-bold bg-sky-500/10 text-sky-400 uppercase tracking-wider">CHARGEMENT...</span>
                <h1 class="text-xl font-bold text-white mt-2 font-mono-code" id="doc-id">---</h1>
            </div>
            <div class="w-12 h-12 rounded-xl bg-sky-600/20 text-sky-400 flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-file-invoice"></i>
            </div>
        </div>

        <div class="space-y-4">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800/60 space-y-2">
                <div class="text-xs text-slate-400 uppercase font-semibold">Client</div>
                <div class="text-lg font-bold text-white" id="client-name">Récupération des données...</div>
            </div>

            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800/60 flex justify-between items-center">
                <span class="text-xs text-slate-400 uppercase font-semibold">Montant Total TTC</span>
                <span class="text-2xl font-bold text-emerald-400 font-mono-code" id="doc-amount">0.00 €</span>
            </div>
        </div>

        <button onclick="window.print()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm flex items-center justify-center space-x-2">
            <i class="fa-solid fa-print"></i><span>Imprimer ou Télécharger en PDF</span>
        </button>
    </div>

    <!-- SCRIPT DE CHARGEMENT SUPABASE -->
    <script>
        const SUPABASE_URL = 'https://esjdlddwxqkhrytvrcok.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzamRsZGR3eHFraHJ5dHZyY29rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTAzOTMsImV4cCI6MjEwODI2NjM5M30.Ec2VMKOjh-XqVRB_gAslFhhP7103pZxEqI33ySoddZ0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const devisId = urlParams.get('devis');
        const factureId = urlParams.get('facture');

        async function loadDocumentFromURL() {
            if (devisId) {
                const { data, error } = await supabaseClient.from('devis').select('*').eq('id', devisId).single();
                if (data) {
                    document.getElementById('client-name').innerText = data.client_name;
                    document.getElementById('doc-id').innerText = data.id;
                    document.getElementById('doc-amount').innerText = parseFloat(data.amount_ttc).toFixed(2) + ' €';
                    document.getElementById('doc-type').innerText = 'DEVIS';
                } else {
                    document.getElementById('client-name').innerText = "Devis introuvable";
                }
            } else if (factureId) {
                const { data, error } = await supabaseClient.from('factures').select('*').eq('id', factureId).single();
                if (data) {
                    document.getElementById('client-name').innerText = data.client_name;
                    document.getElementById('doc-id').innerText = data.id;
                    document.getElementById('doc-amount').innerText = parseFloat(data.amount_ttc).toFixed(2) + ' €';
                    document.getElementById('doc-type').innerText = 'FACTURE';
                } else {
                    document.getElementById('client-name').innerText = "Facture introuvable";
                }
            } else {
                document.getElementById('client-name').innerText = "Aucun document spécifié dans le lien.";
                document.getElementById('doc-type').innerText = 'ERREUR';
            }
        }

        loadDocumentFromURL();
    </script>
</body>
</html>
